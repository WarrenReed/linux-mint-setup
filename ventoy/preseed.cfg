# ==============================================================================
# Linux Mint 22 Ubiquity Preseed Configuration
#
# Compatible with Linux Mint 22 Cinnamon, MATE, and XFCE editions.
#
# REQUIRED: Ubiquity must be started in automatic mode for preseeding to work.
# In Ventoy, add this kernel boot parameter for the Linux Mint ISO:
#   automatic-ubiquity
#
# This file is a template. Variables (${PRESEED_*}) are substituted by
# build-preseed-archive.sh from preseed.env and preseed.env.local.
# Do not put personal values directly in this file.
# ==============================================================================

# ==============================================================================
# Language & Locale
# ==============================================================================
d-i debian-installer/locale string ${PRESEED_LOCALE}

# ==============================================================================
# Keyboard
# ==============================================================================
d-i keyboard-configuration/layoutcode string ${PRESEED_KEYBOARD_LAYOUT}

# ==============================================================================
# Clock & Timezone
# ==============================================================================
d-i clock-setup/utc boolean true
d-i time/zone string ${PRESEED_TIMEZONE}

# ==============================================================================
# Multimedia Codecs
# ==============================================================================
ubiquity ubiquity/use_nonfree boolean true
# nonfree_package must be explicitly set; in automatic mode the UI never
# populates restricted_package_name so the value would otherwise be empty.
ubiquity ubiquity/nonfree_package string mint-meta-codecs

# ==============================================================================
# User Account
# ==============================================================================
d-i passwd/user-fullname string ${PRESEED_FULLNAME}
d-i passwd/username string ${PRESEED_USERNAME}
d-i passwd/auto-login boolean false
d-i netcfg/get_hostname string ${PRESEED_HOSTNAME}

# ==============================================================================
# Post-install
# ==============================================================================
ubiquity ubiquity/reboot boolean true
